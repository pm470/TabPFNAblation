[project]
name = "tabpfn-ablation"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.11.0",
    "numpy>=2.0,<3",
    "schedulefree>=0.6",
    "h5py>=3.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "openml>=0.14",
    "matplotlib>=3.8",
    "autogluon-tabular==1.5.1b20260626",
    "tabarena @ git+https://github.com/autogluon/tabarena.git@bdc1c82ee468f111a8100bc0f57767fb0150c980#subdirectory=packages/tabarena",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120
exclude = ["prior.py"]  # upstream nanoTabPFN code, not ours to lint

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "D"]
# N803, N806: Allow uppercase variables (e.g., X_train) per standard ML conventions.
# N812: Allow `import torch.nn.functional as F` which is standard in PyTorch.
ignore = ["N803", "N806", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # no docstrings required in test files

[tool.uv]
prerelease = "allow"
environments = [
    "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
exclude = ["prior.py", ".venv"]
reportPrivateImportUsage = false

